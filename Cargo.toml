[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravitejarenangi/jarvis"

[workspace.dependencies]
jarvis-core = { path = "crates/jarvis-core" }
# app / UI
bevy = "0.20.1"
bevy_egui = "0.43.1"
bevy_hanabi = "0.20.0"
global-hotkey = "0.9.0"
sysinfo = "0.40.1"
# async + net
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
futures = "0.3.34"
async-stream = "0.3.6"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
bytes = "1.12.1"
# audio + speech
cpal = "0.18.2"
rubato = "5.0.1"
ringbuf = "0.6.0"
hound = "3.5.1"
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }
voice_activity_detector = "0.2.1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
# ai
genai = "0.7.2"
# storage + secrets
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4.2.0"
keyring-core = "1.0.1" # mock store for secrets tests (same instance keyring uses)
getrandom = "0.4.3"
hex = "0.4.3"
directories = "6.0.0"
# macOS
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
# common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"

# Fast debug builds for Bevy, whisper and audio code.
[profile.dev.package."*"]
opt-level = 3
