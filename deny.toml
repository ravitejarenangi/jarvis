# Only permissive licenses, so JARVIS can ship on the App Store.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MIT-0",
  "Unlicense",
  "OpenSSL",
]
confidence-threshold = 0.9

# Crates that ship a license file instead of a license field.
[[licenses.clarify]]
crate = "voice_activity_detector"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x873e249 }]

[[licenses.clarify]]
crate = "webrtc-audio-processing"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0xc47ba509 }]

[[licenses.clarify]]
crate = "webrtc-audio-processing-config"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0xce3e0803 }]

[[licenses.clarify]]
crate = "webrtc-audio-processing-sys"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0xce3e0803 }]

